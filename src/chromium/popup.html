<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #181818;
      color: #f1f1f1;
      margin: 0;
      padding: 12px;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #fff;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
      background: #212121;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #333;
      transition: background 0.2s, border-color 0.2s;
    }
    label:hover {
      background: #2a2a2a;
      border-color: #444;
    }
    input[type="radio"] {
      accent-color: #ff0033;
      cursor: pointer;
    }
    input[type="checkbox"] {
      accent-color: #ff0033;
      cursor: pointer;
    }
    details {
      background: #212121;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    summary {
      cursor: pointer;
      font-weight: bold;
      color: #fff;
    }
    .advanced-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #333;
    }
    .sub-section-title {
      font-weight: bold;
      color: #aaa;
      font-size: 11px;
      margin-top: 4px;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .control-row input[type="range"] {
      width: 100px;
      accent-color: #ff0033;
    }
    .control-row input[type="color"] {
      border: none;
      width: 24px;
      height: 20px;
      background: none;
      cursor: pointer;
    }
    .control-row input[type="text"] {
      width: 90px;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 11px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      width: 100%;
      background: #cc0000;
      color: white;
      border: none;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #e60000;
    }
    .secondary-btn {
      background: #333;
    }
    .secondary-btn:hover {
      background: #444;
    }
    .reset-btn {
      background: #442222;
      color: #ff9999;
    }
    .reset-btn:hover {
      background: #552222;
    }
    .row-btns {
      display: flex;
      gap: 6px;
    }
    .row-btns button {
      flex: 1;
    }
    #status {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-top: 8px;
      min-height: 14px;
    }
    #rawCount {
      font-size: 11px;
      color: #777;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>YouTube Liked Blocker</h3>
  <div class="options">
    <label><input type="radio" name="mode" value="hide"> Hide Completely</label>
    <label><input type="radio" name="mode" value="badge"> Badge Only</label>
    <label><input type="radio" name="mode" value="dim"> Dim Only</label>
    <label><input type="radio" name="mode" value="badge_dim"> Badge & Dim</label>
    <label><input type="radio" name="mode" value="disabled"> Disabled</label>
  </div>

  <details>
    <summary>Advanced Settings</summary>
    <div class="advanced-content">
      <div class="sub-section-title">Badge Customization:</div>
      <div class="control-row">
        <span>Show Badge Counter:</span>
        <input type="checkbox" id="showBadgeInput">
      </div>
      <div class="control-row">
        <span>Badge Text:</span>
        <input type="text" id="badgeTextInput">
      </div>
      <div class="control-row">
        <span>Badge Size:</span>
        <input type="range" id="badgeSizeInput" min="9" max="16" step="1">
      </div>
      <div class="control-row">
        <span>Badge Text Color:</span>
        <input type="color" id="badgeColorInput">
      </div>
      <div class="control-row">
        <span>Text Opacity:</span>
        <input type="range" id="badgeTextOpacityInput" min="0" max="1" step="0.05">
      </div>
      <div class="control-row">
        <span>Badge BG Color:</span>
        <input type="color" id="badgeBgColorInput">
      </div>
      <div class="control-row">
        <span>Badge BG Opacity:</span>
        <input type="range" id="badgeBgOpacityInput" min="0" max="1" step="0.05">
      </div>

      <div class="sub-section-title">Card Customization:</div>
      <div class="control-row">
        <span>Dim Opacity:</span>
        <input type="range" id="dimOpacityInput" min="0" max="1" step="0.05">
      </div>

      <button id="resetSettingsBtn" class="reset-btn">Reset Advanced Defaults</button>
    </div>
  </details>

  <div class="actions">
    <button id="refreshBtn">Sync Liked Playlist</button>
    <button id="openPlaylistBtn" class="secondary-btn">Open Liked Page to Index Older</button>
    <div class="row-btns">
      <button id="exportBtn" class="secondary-btn">Export JSON</button>
      <button id="importBtn" class="secondary-btn">Import JSON</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display: none;">
  </div>
  <div id="status"></div>
  <div id="rawCount"></div>
  <script src="popup.js"></script>
</body>
</html>
